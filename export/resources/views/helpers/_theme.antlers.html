<script type="application/json" id="theme-manifest">
    {{ { dok:theme:manifest} | to_json }}
</script>

<script>
    (() => {
        let manifest = {};

        try {
            manifest = JSON.parse(document.getElementById('theme-manifest').textContent);
        } catch (e) {
            console.warn(`Failed to parse JSON for theme manifest`, e);
        }

        const Theme = Object.freeze({
            themeAttrName: 'data-theme',
            contrastAttrName: 'data-contrast',
            appearanceAttrName: 'data-appearance',

            themes: manifest.themes || [],
            default: manifest.default || {},

            resolveSystemTheme() {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

                return prefersDark ? this.default.dark : this.default.light;
            },

            // 'system', unknown and since-removed themes all resolve to the system default
            resolveId(theme) {
                if (theme === 'system' || ! this.themes.some(t => t.id === theme)) {
                    return this.resolveSystemTheme();
                }

                return theme;
            },

            resolveAppearance(theme) {
                const id = this.resolveId(theme);

                return this.themes.find(t => t.id === id)?.appearance || 'light';
            },
        });

        window.Theme = Theme;

        const currentTheme = localStorage.getItem(Theme.themeAttrName) || 'system';

        if (Theme.themes.length) {
            document.documentElement.setAttribute(Theme.themeAttrName, Theme.resolveId(currentTheme));
            document.documentElement.setAttribute(Theme.appearanceAttrName, Theme.resolveAppearance(currentTheme));
        }

        const contrast = localStorage.getItem(Theme.contrastAttrName) || 'unset';

        document.documentElement.setAttribute(Theme.contrastAttrName, contrast);

        if (window.matchMedia('(prefers-contrast: more)').matches) {
            document.documentElement.setAttribute(Theme.contrastAttrName, 'more');
        }
    })();
</script>
