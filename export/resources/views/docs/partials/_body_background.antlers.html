---
style: 5
---

<div class="relative pointer-events-none h-full">
    <div class="absolute inset-0 h-svh -z-10 overflow-hidden">
        <div class="block w-full"></div>
        {{ if view:style === 1 }}
            <x-effects.grid-gradient />
        {{ /if }}

        {{ if view:style === 2 }}
            <x-effects.gradient />
        {{ /if }}

        {{ if view:style === 3 }}
            <x-effects.aurora animate="false" />
        {{ /if }}

        {{ if view:style === 4 }}
            <x-effects.beams animate="false" />
        {{ /if }}

        {{ if view:style === 5 }}
            <x-effects.ripple animate="false" />
        {{ /if }}
    </div>
</div>
